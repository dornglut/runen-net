name: A5M Lock Refresh

on:
  push:
    branches:
      - rn5e5a5m-live-loopback-success
    paths:
      - crates/runen-net-quic/Cargo.toml
      - .github/workflows/a5m-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: rn5e5a5m-live-loopback-success
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Generate lockfile
        run: cargo +stable generate-lockfile
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "RN5E5A5M: refresh generated lockfile"
          git push origin HEAD:rn5e5a5m-live-loopback-success
