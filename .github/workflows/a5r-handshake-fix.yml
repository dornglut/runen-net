name: A5R Handshake Fix

on:
  push:
    branches:
      - rn5e5a5r-incompatible-alpn
    paths:
      - .github/workflows/a5r-handshake-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: rn5e5a5r-incompatible-alpn
      - name: Patch handshake observation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/runen-net-quic/src/conformance_tests.rs')
          text = path.read_text()
          scenario = text.index('async fn run_incompatible_alpn_scenario()')
          start = text.index('        let connecting = incoming\n', scenario)
          end = text.index('    };\n    let (client_failure, ()) = join2(', start)
          replacement = '''        if let Ok(connecting) = incoming.accept() {
              assert!(
                  connecting.await.is_err(),
                  "incompatible ALPN unexpectedly produced a QUIC Connection"
              );
          }
          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
          cargo +stable fmt --all
      - name: Commit corrected evidence
        run: |
          if git diff --quiet -- crates/runen-net-quic/src/conformance_tests.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/runen-net-quic/src/conformance_tests.rs
          git commit -m "RN5E5A5R: tolerate Quinn handshake rejection phase"
          git push origin HEAD:rn5e5a5r-incompatible-alpn
