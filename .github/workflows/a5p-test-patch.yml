name: A5P Test Patch

on:
  push:
    branches:
      - rn5e5a5p-role-mismatch-bootstrap
    paths:
      - .github/workflows/a5p-test-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: rn5e5a5p-role-mismatch-bootstrap
      - name: Install rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Add real role-mismatch bootstrap evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/runen-net-quic/src/conformance_tests.rs')
          text = path.read_text()

          old = '    control::{LocalControlLimits, SemanticRole, ValidatedControlProfile},\n'
          new = '''    control::{
              LocalControlLimits, ProfileBootstrapError, SemanticRole, ValidatedControlProfile,
          },
          '''
          if old not in text:
              raise SystemExit('control import anchor not found')
          text = text.replace(old, new, 1)

          old = '''        AdmittedProfileReadyConnection, EstablishedNegotiatedConnection, NegotiationSendCompletion,
              NegotiationTransition, PendingNegotiationSend, accept_profile_ready, begin_negotiation,
              connect_profile_ready,
          },
          '''
          new = '''        AdmittedProfileReadyConnection, EstablishedNegotiatedConnection, NegotiationSendCompletion,
              NegotiationTransition, PendingNegotiationSend, ProfileConnectionError,
              accept_profile_ready, begin_negotiation, connect_profile_ready,
          },
          '''
          if old not in text:
              # rustfmt source indentation is 8 spaces under lifecycle::{
              old = '''        AdmittedProfileReadyConnection, EstablishedNegotiatedConnection, NegotiationSendCompletion,
                  NegotiationTransition, PendingNegotiationSend, accept_profile_ready, begin_negotiation,
                  connect_profile_ready,
              },
              '''
              new = '''        AdmittedProfileReadyConnection, EstablishedNegotiatedConnection, NegotiationSendCompletion,
                  NegotiationTransition, PendingNegotiationSend, ProfileConnectionError,
                  accept_profile_ready, begin_negotiation, connect_profile_ready,
              },
              '''
          if old not in text:
              raise SystemExit('lifecycle import anchor not found')
          text = text.replace(old, new, 1)

          marker = 'async fn run_successful_scenario(authority_side: AuthoritySide) {\n'
          if marker not in text:
              raise SystemExit('scenario anchor not found')
          addition = '''#[test]
          fn live_settings_role_mismatch_rejects_profile_and_releases_admission() {
              let runtime = Builder::new_current_thread().enable_all().build().unwrap();
              runtime.block_on(async {
                  tokio::time::timeout(SCENARIO_TIMEOUT, run_role_mismatch_scenario())
                      .await
                      .expect("live SETTINGS role-mismatch conformance scenario timed out");
              });
          }

          async fn run_role_mismatch_scenario() {
              let resources = resources_with_max_connections(1);
              let (client, server) = configured_endpoints_with_resources(resources);
              let server_address = server.endpoint().local_addr().unwrap();

              let (client_failure, server_failure) = join2(
                  connect_profile_ready(
                      &client,
                      server_address,
                      "localhost",
                      profile(resources, SemanticRole::Authority),
                  ),
                  accept_profile_ready(&server, profile(resources, SemanticRole::Authority)),
              )
              .await;

              let client_mismatch = bootstrap_role_mismatch(client_failure.unwrap_err());
              let server_mismatch = bootstrap_role_mismatch(server_failure.unwrap_err());
              assert!(
                  client_mismatch || server_mismatch,
                  "neither production bootstrap observed the SETTINGS semantic-role mismatch"
              );

              let (client_ready, server_ready) = join2(
                  connect_profile_ready(
                      &client,
                      server_address,
                      "localhost",
                      profile(resources, SemanticRole::Authority),
                  ),
                  accept_profile_ready(&server, profile(resources, SemanticRole::NonAuthority)),
              )
              .await;
              let client_ready = client_ready.expect("capacity-1 client permit leaked after bootstrap failure");
              let server_ready = server_ready
                  .expect("capacity-1 server permit leaked after bootstrap failure")
                  .expect("server endpoint remained open for corrected retry");

              drop(client_ready);
              drop(server_ready);
              client
                  .endpoint()
                  .close(VarInt::from_u32(0), b"role-mismatch test complete");
              server
                  .endpoint()
                  .close(VarInt::from_u32(0), b"role-mismatch test complete");
              join2(client.endpoint().wait_idle(), server.endpoint().wait_idle()).await;
          }

          fn bootstrap_role_mismatch(error: ProfileConnectionError) -> bool {
              match error {
                  ProfileConnectionError::Bootstrap(ProfileBootstrapError::PeerRoleMismatch {
                      expected: SemanticRole::NonAuthority,
                      received: SemanticRole::Authority,
                  }) => true,
                  ProfileConnectionError::Bootstrap(_) => false,
                  other => panic!("role-mismatch connection failed outside bootstrap: {other:?}"),
              }
          }

          '''
          text = text.replace(marker, addition + marker, 1)

          old = '''fn configured_endpoints() -> (ConfiguredEndpoint, ConfiguredEndpoint) {
              let resources = resources();
              let (certificate, private_key, roots) = ephemeral_identity();
          '''
          new = '''fn configured_endpoints() -> (ConfiguredEndpoint, ConfiguredEndpoint) {
              configured_endpoints_with_resources(resources())
          }

          fn configured_endpoints_with_resources(
              resources: ValidatedEndpointResources,
          ) -> (ConfiguredEndpoint, ConfiguredEndpoint) {
              let (certificate, private_key, roots) = ephemeral_identity();
          '''
          if old not in text:
              # likely normal 4-space source indentation
              old = '''fn configured_endpoints() -> (ConfiguredEndpoint, ConfiguredEndpoint) {
                  let resources = resources();
                  let (certificate, private_key, roots) = ephemeral_identity();
              '''
              new = '''fn configured_endpoints() -> (ConfiguredEndpoint, ConfiguredEndpoint) {
                  configured_endpoints_with_resources(resources())
              }

              fn configured_endpoints_with_resources(
                  resources: ValidatedEndpointResources,
              ) -> (ConfiguredEndpoint, ConfiguredEndpoint) {
                  let (certificate, private_key, roots) = ephemeral_identity();
              '''
          if old not in text:
              raise SystemExit('configured endpoints anchor not found')
          text = text.replace(old, new, 1)

          old = '''fn resources() -> ValidatedEndpointResources {
              EndpointResourceLimits {
                  max_connections: 4,
          '''
          new = '''fn resources() -> ValidatedEndpointResources {
              resources_with_max_connections(4)
          }

          fn resources_with_max_connections(max_connections: usize) -> ValidatedEndpointResources {
              EndpointResourceLimits {
                  max_connections,
          '''
          if old not in text:
              old = '''fn resources() -> ValidatedEndpointResources {
                  EndpointResourceLimits {
                      max_connections: 4,
              '''
              new = '''fn resources() -> ValidatedEndpointResources {
                  resources_with_max_connections(4)
              }

              fn resources_with_max_connections(max_connections: usize) -> ValidatedEndpointResources {
                  EndpointResourceLimits {
                      max_connections,
              '''
          if old not in text:
              raise SystemExit('resources anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          cargo +stable fmt --all
      - name: Commit test-only evidence
        run: |
          if git diff --quiet -- crates/runen-net-quic/src/conformance_tests.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/runen-net-quic/src/conformance_tests.rs
          git commit -m "RN5E5A5P: prove role-mismatch bootstrap rejection"
          git push origin HEAD:rn5e5a5p-role-mismatch-bootstrap
