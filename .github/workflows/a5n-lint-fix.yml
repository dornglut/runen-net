name: A5N Lint Fix

on:
  push:
    branches:
      - rn5e5a5n-live-connection-loss
    paths:
      - .github/workflows/a5n-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: rn5e5a5n-live-connection-loss
      - name: Remove proven unused mutability
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/runen-net-quic/src/conformance_tests.rs')
          text = path.read_text()
          text = text.replace(
              '    let mut client_side = activate(client_negotiated, client_manager);\n',
              '    let client_side = activate(client_negotiated, client_manager);\n',
              1,
          )
          text = text.replace(
              '    let mut server_side = activate(server_negotiated, server_manager);\n',
              '    let server_side = activate(server_negotiated, server_manager);\n',
              1,
          )
          path.write_text(text)
          PY
          cargo +stable fmt --all
      - name: Commit lint-only correction
        run: |
          if git diff --quiet -- crates/runen-net-quic/src/conformance_tests.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/runen-net-quic/src/conformance_tests.rs
          git commit -m "RN5E5A5N: remove unused helper mutability"
          git push origin HEAD:rn5e5a5n-live-connection-loss
