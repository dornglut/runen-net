name: RN5E2 Draft

on:
  push:
    branches:
      - rn5e2-secure-endpoints

permissions:
  contents: write

jobs:
  candidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out draft branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: rn5e2-secure-endpoints
          fetch-depth: 0
      - name: Install maintained Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Apply compile-review correction
        run: |
          sed -i 's/quinn::rustls::pki_types::PrivatePkcs8KeyDer/rustls::pki_types::PrivatePkcs8KeyDer/g' crates/runen-net-quic/src/endpoint.rs
      - name: Format and validate focused adapter
        run: |
          cargo +stable fmt --all
          cargo +stable test -p runen-net-quic --all-targets
          cargo +stable clippy -p runen-net-quic --all-targets -- -D warnings
      - name: Commit resolved lock and formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/runen-net-quic/Cargo.toml crates/runen-net-quic/src/endpoint.rs crates/runen-net-quic/src/lib.rs
          if ! git diff --cached --quiet; then
            git commit -m 'RN5E2 draft: resolve secure endpoint candidate'
            git push
          fi
