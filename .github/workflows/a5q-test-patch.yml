name: A5Q Test Patch

on:
  push:
    branches:
      - rn5e5a5q-missing-datagram
    paths:
      - .github/workflows/a5q-test-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: rn5e5a5q-missing-datagram
      - name: Install rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Add missing DATAGRAM conformance evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          endpoint = Path('crates/runen-net-quic/src/endpoint.rs')
          text = endpoint.read_text()
          marker = '''fn bind_udp_socket(bind_addr: SocketAddr) -> io::Result<UdpSocket> {
          '''
          if marker not in text:
              raise SystemExit('endpoint helper anchor not found')
          helper = '''#[cfg(test)]
          pub(super) fn bind_server_endpoint_without_datagrams(
              bind_addr: SocketAddr,
              resources: ValidatedEndpointResources,
              certificate_chain: Vec<CertificateDer<'static>>,
              private_key: PrivateKeyDer<'static>,
          ) -> Result<Endpoint, EndpointBuildError> {
              let tls = build_server_tls(certificate_chain, private_key)?;
              let crypto = QuicServerConfig::try_from(tls)
                  .map_err(EndpointBuildError::MissingInitialCipherSuite)?;
              let mut server_config = ServerConfig::with_crypto(Arc::new(crypto));
              let mut transport = build_transport_config(WireSide::Server, resources);
              transport.datagram_receive_buffer_size(None);
              server_config.transport_config(Arc::new(transport));
              let socket = bind_udp_socket(bind_addr)?;
              Ok(Endpoint::new(
                  build_endpoint_config(resources)?,
                  Some(server_config),
                  socket,
                  Arc::new(TokioRuntime),
              )?)
          }

          '''
          text = text.replace(marker, helper + marker, 1)
          endpoint.write_text(text)

          conformance = Path('crates/runen-net-quic/src/conformance_tests.rs')
          text = conformance.read_text()
          old = '''        ConfiguredEndpoint, EndpointResourceLimits, ValidatedEndpointResources,
              bind_client_endpoint, bind_server_endpoint,
          },
          '''
          new = '''        ConfiguredEndpoint, EndpointResourceLimits, ValidatedEndpointResources,
              bind_client_endpoint, bind_server_endpoint, bind_server_endpoint_without_datagrams,
          },
          '''
          if old not in text:
              old = '''        ConfiguredEndpoint, EndpointResourceLimits, ValidatedEndpointResources,
                  bind_client_endpoint, bind_server_endpoint,
              },
              '''
              new = '''        ConfiguredEndpoint, EndpointResourceLimits, ValidatedEndpointResources,
                  bind_client_endpoint, bind_server_endpoint, bind_server_endpoint_without_datagrams,
              },
              '''
          if old not in text:
              raise SystemExit('endpoint import anchor not found')
          text = text.replace(old, new, 1)

          marker = '''async fn run_role_mismatch_scenario() {
          '''
          if marker not in text:
              raise SystemExit('role-mismatch scenario anchor not found')
          addition = '''#[test]
          fn live_missing_datagram_rejects_profile_and_releases_admission() {
              let runtime = Builder::new_current_thread().enable_all().build().unwrap();
              runtime.block_on(async {
                  tokio::time::timeout(SCENARIO_TIMEOUT, run_missing_datagram_scenario())
                      .await
                      .expect("live missing-DATAGRAM conformance scenario timed out");
              });
          }

          async fn run_missing_datagram_scenario() {
              let resources = resources_with_max_connections(1);
              let (certificate, private_key, roots) = ephemeral_identity();
              let client = bind_client_endpoint(loopback_ephemeral(), resources, roots).unwrap();
              let no_datagram_server = bind_server_endpoint_without_datagrams(
                  loopback_ephemeral(),
                  resources,
                  vec![certificate.clone()],
                  private_key.clone_key(),
              )
              .unwrap();
              let no_datagram_address = no_datagram_server.local_addr().unwrap();

              let negative_peer = async {
                  let incoming = no_datagram_server
                      .accept()
                      .await
                      .expect("negative DATAGRAM endpoint closed before handshake");
                  let connecting = incoming
                      .accept()
                      .expect("negative DATAGRAM peer rejected compatible QUIC handshake");
                  let connection = connecting
                      .await
                      .expect("negative DATAGRAM peer failed compatible runennet/1 handshake");
                  assert!(
                      connection.accept_bi().await.is_err(),
                      "production client opened the RunenNet control stream before DATAGRAM confirmation"
                  );
              };
              let (client_failure, ()) = join2(
                  connect_profile_ready(
                      &client,
                      no_datagram_address,
                      "localhost",
                      profile(resources, SemanticRole::Authority),
                  ),
                  negative_peer,
              )
              .await;
              assert!(matches!(
                  client_failure,
                  Err(ProfileConnectionError::Bootstrap(
                      ProfileBootstrapError::DatagramUnsupported
                  ))
              ));

              no_datagram_server.close(VarInt::from_u32(0), b"negative DATAGRAM test complete");
              no_datagram_server.wait_idle().await;

              let server = bind_server_endpoint(
                  loopback_ephemeral(),
                  resources,
                  vec![certificate],
                  private_key,
              )
              .unwrap();
              let server_address = server.endpoint().local_addr().unwrap();
              let (client_ready, server_ready) = join2(
                  connect_profile_ready(
                      &client,
                      server_address,
                      "localhost",
                      profile(resources, SemanticRole::Authority),
                  ),
                  accept_profile_ready(&server, profile(resources, SemanticRole::NonAuthority)),
              )
              .await;
              let client_ready =
                  client_ready.expect("capacity-1 client permit leaked after DATAGRAM rejection");
              let server_ready = server_ready
                  .expect("conforming retry server failed after DATAGRAM rejection")
                  .expect("conforming retry server endpoint closed unexpectedly");

              drop(client_ready);
              drop(server_ready);
              client
                  .endpoint()
                  .close(VarInt::from_u32(0), b"missing-DATAGRAM test complete");
              server
                  .endpoint()
                  .close(VarInt::from_u32(0), b"missing-DATAGRAM test complete");
              join2(client.endpoint().wait_idle(), server.endpoint().wait_idle()).await;
          }

          '''
          text = text.replace(marker, addition + marker, 1)
          conformance.write_text(text)
          PY
          cargo +stable fmt --all
      - name: Commit test-only evidence
        run: |
          if git diff --quiet -- crates/runen-net-quic/src/endpoint.rs crates/runen-net-quic/src/conformance_tests.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/runen-net-quic/src/endpoint.rs crates/runen-net-quic/src/conformance_tests.rs
          git commit -m "RN5E5A5Q: prove missing DATAGRAM blocks ProfileReady"
          git push origin HEAD:rn5e5a5q-missing-datagram
