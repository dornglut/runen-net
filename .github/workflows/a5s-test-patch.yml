name: A5S Test Patch

on:
  push:
    branches:
      - rn5e5a5s-overlapping-admission
    paths:
      - .github/workflows/a5s-test-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: rn5e5a5s-overlapping-admission
      - name: Add overlapping admission conformance evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/runen-net-quic/src/conformance_tests.rs')
          text = path.read_text()
          old_import = "    endpoint::{\n        ConfiguredEndpoint, EndpointResourceLimits, ValidatedEndpointResources,\n        bind_client_endpoint, bind_server_endpoint, bind_server_endpoint_with_incompatible_alpn,\n        bind_server_endpoint_without_datagrams,\n    },\n"
          new_import = "    endpoint::{\n        ConfiguredEndpoint, ConnectionAdmissionError, EndpointResourceLimits,\n        ValidatedEndpointResources, bind_client_endpoint, bind_server_endpoint,\n        bind_server_endpoint_with_incompatible_alpn, bind_server_endpoint_without_datagrams,\n    },\n"
          if old_import not in text:
              raise SystemExit('endpoint import anchor not found')
          text = text.replace(old_import, new_import, 1)
          marker = "#[test]\nfn live_incompatible_alpn_is_rejected_at_handshake_and_releases_admission() {\n"
          if marker not in text:
              raise SystemExit('A5R test anchor not found')
          addition = """#[test]
          fn live_overlapping_connection_is_refused_at_server_capacity_and_slot_reopens() {
              let runtime = Builder::new_current_thread().enable_all().build().unwrap();
              runtime.block_on(async {
                  tokio::time::timeout(SCENARIO_TIMEOUT, run_overlapping_admission_scenario())
                      .await
                      .expect(\"live overlapping-admission conformance scenario timed out\");
              });
          }

          async fn run_overlapping_admission_scenario() {
              let resources = resources_with_max_connections(1);
              let (certificate, private_key, roots) = ephemeral_identity();
              let client_a = bind_client_endpoint(loopback_ephemeral(), resources, Arc::clone(&roots)).unwrap();
              let client_b = bind_client_endpoint(loopback_ephemeral(), resources, roots).unwrap();
              let server = bind_server_endpoint(
                  loopback_ephemeral(),
                  resources,
                  vec![certificate],
                  private_key,
              )
              .unwrap();
              let server_address = server.endpoint().local_addr().unwrap();

              let (client_a_ready, server_a_ready) = join2(
                  connect_profile_ready(
                      &client_a,
                      server_address,
                      \"localhost\",
                      profile(resources, SemanticRole::Authority),
                  ),
                  accept_profile_ready(&server, profile(resources, SemanticRole::NonAuthority)),
              )
              .await;
              let client_a_ready = client_a_ready.expect(\"first capacity-1 client failed ProfileReady\");
              let server_a_ready = server_a_ready
                  .expect(\"first capacity-1 server failed ProfileReady\")
                  .expect(\"capacity-1 server endpoint closed before first ProfileReady\");

              let (client_b_failure, server_rejection) = join2(
                  connect_profile_ready(
                      &client_b,
                      server_address,
                      \"localhost\",
                      profile(resources, SemanticRole::Authority),
                  ),
                  accept_profile_ready(&server, profile(resources, SemanticRole::NonAuthority)),
              )
              .await;
              assert!(matches!(
                  server_rejection,
                  Err(ProfileConnectionError::Admission(
                      ConnectionAdmissionError::AtCapacity
                  ))
              ));
              assert!(matches!(
                  client_b_failure,
                  Err(ProfileConnectionError::Handshake(_))
              ));

              drop(client_a_ready);
              drop(server_a_ready);

              let (client_b_ready, server_b_ready) = join2(
                  connect_profile_ready(
                      &client_b,
                      server_address,
                      \"localhost\",
                      profile(resources, SemanticRole::Authority),
                  ),
                  accept_profile_ready(&server, profile(resources, SemanticRole::NonAuthority)),
              )
              .await;
              let client_b_ready =
                  client_b_ready.expect(\"client-B admission permit leaked after refused overlap\");
              let server_b_ready = server_b_ready
                  .expect(\"server slot did not reopen after first admitted connection was released\")
                  .expect(\"server endpoint closed before post-overlap retry\");

              drop(client_b_ready);
              drop(server_b_ready);
              client_a
                  .endpoint()
                  .close(VarInt::from_u32(0), b\"overlapping admission test complete\");
              client_b
                  .endpoint()
                  .close(VarInt::from_u32(0), b\"overlapping admission test complete\");
              server
                  .endpoint()
                  .close(VarInt::from_u32(0), b\"overlapping admission test complete\");
              client_a.endpoint().wait_idle().await;
              client_b.endpoint().wait_idle().await;
              server.endpoint().wait_idle().await;
          }

          """
          path.write_text(text.replace(marker, addition + marker, 1))
          PY
          cargo +stable fmt --all
      - name: Commit test-only evidence
        run: |
          if git diff --quiet -- crates/runen-net-quic/src/conformance_tests.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/runen-net-quic/src/conformance_tests.rs
          git commit -m "RN5E5A5S: prove real overlapping endpoint admission"
          git push origin HEAD:rn5e5a5s-overlapping-admission
