name: A5R Test Patch

on:
  push:
    branches:
      - rn5e5a5r-incompatible-alpn
    paths:
      - .github/workflows/a5r-test-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: rn5e5a5r-incompatible-alpn
      - name: Install rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Add incompatible ALPN conformance evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          endpoint = Path('crates/runen-net-quic/src/endpoint.rs')
          text = endpoint.read_text()
          marker = '''#[cfg(test)]
          pub(super) fn bind_server_endpoint_without_datagrams(
          '''
          if marker not in text:
              raise SystemExit('missing-DATAGRAM helper anchor not found')
          helper = '''#[cfg(test)]
          pub(super) fn bind_server_endpoint_with_incompatible_alpn(
              bind_addr: SocketAddr,
              resources: ValidatedEndpointResources,
              certificate_chain: Vec<CertificateDer<'static>>,
              private_key: PrivateKeyDer<'static>,
          ) -> Result<Endpoint, EndpointBuildError> {
              let mut tls = build_server_tls(certificate_chain, private_key)?;
              tls.alpn_protocols = vec![b"not-runennet/1".to_vec()];
              let crypto = QuicServerConfig::try_from(tls)
                  .map_err(EndpointBuildError::MissingInitialCipherSuite)?;
              let mut server_config = ServerConfig::with_crypto(Arc::new(crypto));
              server_config.transport_config(Arc::new(build_transport_config(
                  WireSide::Server,
                  resources,
              )));
              let socket = bind_udp_socket(bind_addr)?;
              Ok(Endpoint::new(
                  build_endpoint_config(resources)?,
                  Some(server_config),
                  socket,
                  Arc::new(TokioRuntime),
              )?)
          }

          '''
          text = text.replace(marker, helper + marker, 1)
          endpoint.write_text(text)

          conformance = Path('crates/runen-net-quic/src/conformance_tests.rs')
          text = conformance.read_text()
          old = '''        ConfiguredEndpoint, EndpointResourceLimits, ValidatedEndpointResources,
              bind_client_endpoint, bind_server_endpoint, bind_server_endpoint_without_datagrams,
          },
          '''
          new = '''        ConfiguredEndpoint, EndpointResourceLimits, ValidatedEndpointResources,
              bind_client_endpoint, bind_server_endpoint, bind_server_endpoint_with_incompatible_alpn,
              bind_server_endpoint_without_datagrams,
          },
          '''
          if old not in text:
              old = '''        ConfiguredEndpoint, EndpointResourceLimits, ValidatedEndpointResources,
                  bind_client_endpoint, bind_server_endpoint, bind_server_endpoint_without_datagrams,
              },
              '''
              new = '''        ConfiguredEndpoint, EndpointResourceLimits, ValidatedEndpointResources,
                  bind_client_endpoint, bind_server_endpoint, bind_server_endpoint_with_incompatible_alpn,
                  bind_server_endpoint_without_datagrams,
              },
              '''
          if old not in text:
              raise SystemExit('endpoint import anchor not found')
          text = text.replace(old, new, 1)

          marker = '''#[test]
          fn live_missing_datagram_rejects_profile_and_releases_admission() {
          '''
          if marker not in text:
              raise SystemExit('missing-DATAGRAM test anchor not found')
          addition = '''#[test]
          fn live_incompatible_alpn_is_rejected_at_handshake_and_releases_admission() {
              let runtime = Builder::new_current_thread().enable_all().build().unwrap();
              runtime.block_on(async {
                  tokio::time::timeout(SCENARIO_TIMEOUT, run_incompatible_alpn_scenario())
                      .await
                      .expect("live incompatible-ALPN conformance scenario timed out");
              });
          }

          async fn run_incompatible_alpn_scenario() {
              let resources = resources_with_max_connections(1);
              let (certificate, private_key, roots) = ephemeral_identity();
              let client = bind_client_endpoint(loopback_ephemeral(), resources, roots).unwrap();
              let incompatible_server = bind_server_endpoint_with_incompatible_alpn(
                  loopback_ephemeral(),
                  resources,
                  vec![certificate.clone()],
                  private_key.clone_key(),
              )
              .unwrap();
              let incompatible_address = incompatible_server.local_addr().unwrap();

              let negative_peer = async {
                  let incoming = incompatible_server
                      .accept()
                      .await
                      .expect("incompatible-ALPN endpoint closed before handshake attempt");
                  let connecting = incoming
                      .accept()
                      .expect("incompatible-ALPN peer rejected QUIC admission before TLS handshake");
                  assert!(
                      connecting.await.is_err(),
                      "incompatible ALPN unexpectedly produced a QUIC Connection"
                  );
              };
              let (client_failure, ()) = join2(
                  connect_profile_ready(
                      &client,
                      incompatible_address,
                      "localhost",
                      profile(resources, SemanticRole::Authority),
                  ),
                  negative_peer,
              )
              .await;
              assert!(matches!(
                  client_failure,
                  Err(ProfileConnectionError::Handshake(_))
              ));

              incompatible_server.close(VarInt::from_u32(0), b"incompatible ALPN test complete");
              incompatible_server.wait_idle().await;

              let server = bind_server_endpoint(
                  loopback_ephemeral(),
                  resources,
                  vec![certificate],
                  private_key,
              )
              .unwrap();
              let server_address = server.endpoint().local_addr().unwrap();
              let (client_ready, server_ready) = join2(
                  connect_profile_ready(
                      &client,
                      server_address,
                      "localhost",
                      profile(resources, SemanticRole::Authority),
                  ),
                  accept_profile_ready(&server, profile(resources, SemanticRole::NonAuthority)),
              )
              .await;
              let client_ready =
                  client_ready.expect("capacity-1 client permit leaked after ALPN handshake failure");
              let server_ready = server_ready
                  .expect("conforming retry server failed after ALPN handshake failure")
                  .expect("conforming retry server endpoint closed unexpectedly");

              drop(client_ready);
              drop(server_ready);
              client
                  .endpoint()
                  .close(VarInt::from_u32(0), b"incompatible-ALPN test complete");
              server
                  .endpoint()
                  .close(VarInt::from_u32(0), b"incompatible-ALPN test complete");
              join2(client.endpoint().wait_idle(), server.endpoint().wait_idle()).await;
          }

          '''
          text = text.replace(marker, addition + marker, 1)
          conformance.write_text(text)
          PY
          cargo +stable fmt --all
      - name: Commit test-only evidence
        run: |
          if git diff --quiet -- crates/runen-net-quic/src/endpoint.rs crates/runen-net-quic/src/conformance_tests.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/runen-net-quic/src/endpoint.rs crates/runen-net-quic/src/conformance_tests.rs
          git commit -m "RN5E5A5R: prove incompatible ALPN handshake rejection"
          git push origin HEAD:rn5e5a5r-incompatible-alpn
