name: A5M Harness Fix

on:
  push:
    branches:
      - rn5e5a5m-live-loopback-success
    paths:
      - .github/workflows/a5m-format-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: rn5e5a5m-live-loopback-success
      - name: Install rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Fix establishment readiness and format
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/runen-net-quic/src/conformance_tests.rs')
          text = path.read_text()
          start = text.index('async fn establish_flow(')
          end = text.index('\nasync fn send_reliable_and_expect(', start)
          replacement = '''async fn establish_flow(
              sender: &mut LiveSide,
              receiver: &mut LiveSide,
              mode: DeliveryMode,
              outbound_handle: u64,
              inbound_handle: u64,
          ) -> LiveFlow {
              let outbound = DeliveryFlowKey::new(
                  CONNECTION,
                  FlowDirection::Outbound,
                  DeliveryFlowHandle::new(outbound_handle),
              );
              let inbound = DeliveryFlowKey::new(
                  CONNECTION,
                  FlowDirection::Inbound,
                  DeliveryFlowHandle::new(inbound_handle),
              );
              sender
                  .driver
                  .open_outbound(
                      &sender.host.delivery,
                      OutboundOpenRequest {
                          key: outbound,
                          mode,
                          policy: policy(mode),
                          stable_max_message_bytes: nz(MAX_MESSAGE_BYTES),
                          connection_limits: connection_limits(),
                      },
                  )
                  .unwrap();

              let mut accepted_flow_id = None;
              let mut established_flow_id = None;
              let mut accept_send_completed = false;
              loop {
                  let (sender_progress, receiver_progress) = next_pair_progress(sender, receiver).await;
                  if let Some(progress) = receiver_progress {
                      match progress {
                          EstablishedConnectionProgress::InboundOpen(request) => {
                              assert_eq!(request.mode(), mode);
                              assert_eq!(request.max_message_bytes(), MAX_MESSAGE_BYTES as u64);
                              accepted_flow_id = Some(request.flow_id());
                              receiver
                                  .driver
                                  .accept_inbound(
                                      &mut receiver.host.delivery,
                                      request,
                                      InboundAdmission {
                                          key: inbound,
                                          policy: policy(mode),
                                          connection_limits: connection_limits(),
                                      },
                                  )
                                  .unwrap();
                          }
                          EstablishedConnectionProgress::ControlSendCompleted(
                              crate::flow_driver::FlowControlSendEffect::InboundAccepted(flow),
                          ) => {
                              assert_eq!(flow.key(), inbound);
                              assert_eq!(flow.mode(), mode);
                              assert_eq!(Some(flow.flow_id()), accepted_flow_id);
                              accept_send_completed = true;
                          }
                          other => assert_non_failure_progress(&other),
                      }
                  }
                  if let Some(progress) = sender_progress {
                      match progress {
                          EstablishedConnectionProgress::OutboundEstablished(flow) => {
                              assert_eq!(flow.key(), outbound);
                              assert_eq!(flow.mode(), mode);
                              assert_eq!(Some(flow.flow_id()), accepted_flow_id);
                              established_flow_id = Some(flow.flow_id());
                          }
                          other => assert_non_failure_progress(&other),
                      }
                  }
                  if accept_send_completed
                      && let Some(flow_id) = established_flow_id
                  {
                      return LiveFlow {
                          flow_id,
                          outbound,
                          inbound,
                      };
                  }
              }
          }
          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          cargo +stable fmt --all
      - name: Commit mechanical fixes
        run: |
          if git diff --quiet -- crates/runen-net-quic/src/conformance_tests.rs crates/runen-net-quic/src/lib.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/runen-net-quic/src/conformance_tests.rs crates/runen-net-quic/src/lib.rs
          git commit -m "RN5E5A5M: fix establishment readiness and format"
          git push origin HEAD:rn5e5a5m-live-loopback-success
