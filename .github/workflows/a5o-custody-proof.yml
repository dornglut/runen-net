name: A5O Custody Proof

on:
  push:
    branches:
      - rn5e5a5o-fresh-replacement-state
    paths:
      - .github/workflows/a5o-custody-proof.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: rn5e5a5o-fresh-replacement-state
      - name: Install rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Strengthen live custody teardown evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('crates/runen-net-quic/src/conformance_tests.rs')
          text = path.read_text()

          marker = '    let first_reliable_flow_id = first_reliable.flow_id;\n'
          if marker not in text:
              raise SystemExit('first lifetime marker not found')
          custody = '''    let buffered_payload = b"first-connection-buffered-custody".to_vec();
          assert!(matches!(
              first_server.driver.submit_unreliable(
                  &mut first_server.host.delivery,
                  first_sequenced.flow_id,
                  buffered_payload.clone(),
              ),
              Ok(DatagramSubmitOutcome::Submitted(
                  DatagramSubmissionOutcome::Accepted {
                      accepted_index: 1,
                      local_pressure_drops: 0,
                  }
              ))
          ));
          drive_until_buffered_without_exposure(
              &mut first_server,
              &mut first_client,
              first_sequenced.inbound,
              buffered_payload.len(),
          )
          .await;
          assert_eq!(first_client.host.delivery.pending_messages(), 1);
          assert_eq!(
              first_client.host.delivery.pending_payload_bytes(),
              buffered_payload.len()
          );

          '''
          text = text.replace(marker, custody + marker, 1)

          replacements = {
              '    let client_host = teardown_live_side(first_client, 2);\n':
                  '    let client_host = teardown_live_side(first_client, 2, 1);\n',
              '    let server_host = teardown_live_side(first_server, 2);\n':
                  '    let server_host = teardown_live_side(first_server, 2, 0);\n',
              '    let _client_host = teardown_live_side(replacement_client, 2);\n':
                  '    let _client_host = teardown_live_side(replacement_client, 2, 0);\n',
              '    let _server_host = teardown_live_side(replacement_server, 2);\n':
                  '    let _server_host = teardown_live_side(replacement_server, 2, 0);\n',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing teardown call: {old.strip()}')
              text = text.replace(old, new, 1)

          fresh = '    assert_eq!(replacement_server.host.delivery.active_flows(), 0);\n'
          if fresh not in text:
              raise SystemExit('fresh replacement marker not found')
          text = text.replace(
              fresh,
              fresh
              + '    assert_eq!(replacement_client.host.delivery.pending_messages(), 0);\n'
              + '    assert_eq!(replacement_server.host.delivery.pending_messages(), 0);\n'
              + '    assert_eq!(replacement_client.host.delivery.pending_payload_bytes(), 0);\n'
              + '    assert_eq!(replacement_server.host.delivery.pending_payload_bytes(), 0);\n',
              1,
          )

          pattern = re.compile(
              r'fn teardown_live_side\(mut side: LiveSide, expected_flows: usize\) -> HostState \{.*?\n\}\n\n(?=async fn wait_for_connection_terminal_error)',
              re.S,
          )
          replacement = '''fn teardown_live_side(
              mut side: LiveSide,
              expected_flows: usize,
              expected_pending_messages: usize,
          ) -> HostState {
              let connection = side.connection;
              let teardown = side
                  .driver
                  .teardown(&mut side.host.negotiation, &mut side.host.delivery);
              assert_eq!(teardown.connection, connection);
              assert!(teardown.negotiation_cleanup_error.is_none());
              assert_eq!(teardown.flow_terminations.len(), expected_flows);
              assert!(
                  teardown
                      .flow_terminations
                      .iter()
                      .all(|termination| termination.reason == FlowTerminationReason::ConnectionEnded)
              );
              assert_eq!(
                  teardown
                      .flow_terminations
                      .iter()
                      .map(|termination| termination.pending_messages)
                      .sum::<usize>(),
                  expected_pending_messages
              );
              assert_eq!(side.host.delivery.active_flows(), 0);
              assert_eq!(side.host.delivery.pending_messages(), 0);
              assert_eq!(side.host.delivery.pending_payload_bytes(), 0);
              side.host
          }

          '''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('teardown helper replacement failed')

          anchor = 'async fn drive_until_exposed(\n'
          if anchor not in text:
              raise SystemExit('drive helper anchor not found')
          helper = '''async fn drive_until_buffered_without_exposure(
              sender: &mut LiveSide,
              receiver: &mut LiveSide,
              inbound: DeliveryFlowKey,
              expected_payload_bytes: usize,
          ) {
              loop {
                  if receiver.host.delivery.flow_pending_usage(inbound)
                      == Some((1, expected_payload_bytes))
                  {
                      return;
                  }
                  let (sender_progress, receiver_progress) = next_pair_progress(sender, receiver).await;
                  if let Some(progress) = sender_progress.as_ref() {
                      assert_non_failure_progress(progress);
                  }
                  if let Some(progress) = receiver_progress.as_ref() {
                      assert_non_failure_progress(progress);
                  }
              }
          }

          '''
          text = text.replace(anchor, helper + anchor, 1)

          path.write_text(text)
          PY
          cargo +stable fmt --all
      - name: Commit strengthened evidence
        run: |
          if git diff --quiet -- crates/runen-net-quic/src/conformance_tests.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/runen-net-quic/src/conformance_tests.rs
          git commit -m "RN5E5A5O: prove buffered custody is cleared on replacement"
          git push origin HEAD:rn5e5a5o-fresh-replacement-state
