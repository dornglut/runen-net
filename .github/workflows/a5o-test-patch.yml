name: A5O Test Patch

on:
  push:
    branches:
      - rn5e5a5o-fresh-replacement-state
    paths:
      - .github/workflows/a5o-test-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: rn5e5a5o-fresh-replacement-state
      - name: Install rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Add replacement-state conformance evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/runen-net-quic/src/conformance_tests.rs')
          text = path.read_text()

          # Existing accepted scenarios all use lifetime 1. Parameterize the harness
          # before introducing lifetime 2 so no old assertion silently changes scope.
          text = text.replace('CONNECTION', 'FIRST_CONNECTION')
          text = text.replace(
              'const FIRST_CONNECTION: ConnectionHandle = ConnectionHandle::new(1);\n',
              'const FIRST_CONNECTION: ConnectionHandle = ConnectionHandle::new(1);\n'
              'const REPLACEMENT_CONNECTION: ConnectionHandle = ConnectionHandle::new(2);\n',
              1,
          )
          text = text.replace(
              '''struct LiveSide {
              driver: EstablishedConnectionDriver,
              host: HostState,
          }''',
              '''struct LiveSide {
              connection: ConnectionHandle,
              driver: EstablishedConnectionDriver,
              host: HostState,
          }''',
              1,
          )

          loss_test = '''#[test]
          fn live_quic_connection_close_is_terminal_and_teardown_cleans_connection_state() {
              let runtime = Builder::new_current_thread().enable_all().build().unwrap();
              runtime.block_on(async {
                  tokio::time::timeout(SCENARIO_TIMEOUT, run_connection_loss_scenario())
                      .await
                      .expect("live QUIC connection-loss conformance scenario timed out");
              });
          }
          '''
          if loss_test not in text:
              raise SystemExit('A5N test anchor not found')
          text = text.replace(
              loss_test,
              loss_test + '''
          #[test]
          fn replacement_connection_restarts_fresh_connection_scoped_state() {
              let runtime = Builder::new_current_thread().enable_all().build().unwrap();
              runtime.block_on(async {
                  tokio::time::timeout(SCENARIO_TIMEOUT, run_replacement_scenario())
                      .await
                      .expect("live QUIC replacement-state conformance scenario timed out");
              });
          }
          ''',
              1,
          )

          setup_start = text.index('async fn establish_live_pair(')
          setup_end = text.index('\nasync fn run_connection_loss_scenario()', setup_start)
          replacement_setup = '''fn configured_endpoints() -> (ConfiguredEndpoint, ConfiguredEndpoint) {
              let resources = resources();
              let (certificate, private_key, roots) = ephemeral_identity();
              let server = bind_server_endpoint(
                  loopback_ephemeral(),
                  resources,
                  vec![certificate],
                  private_key,
              )
              .unwrap();
              let client = bind_client_endpoint(loopback_ephemeral(), resources, roots).unwrap();
              (client, server)
          }

          fn new_host() -> HostState {
              HostState {
                  negotiation: new_manager(),
                  delivery: DeliveryEndpoint::new(aggregate_limits()),
              }
          }

          async fn establish_live_pair(
              authority_side: AuthoritySide,
          ) -> (ConfiguredEndpoint, ConfiguredEndpoint, LiveSide, LiveSide) {
              let (client, server) = configured_endpoints();
              let (client_side, server_side) = establish_connection_on_endpoints(
                  &client,
                  &server,
                  authority_side,
                  FIRST_CONNECTION,
                  new_host(),
                  new_host(),
              )
              .await;
              (client, server, client_side, server_side)
          }

          async fn establish_connection_on_endpoints(
              client: &ConfiguredEndpoint,
              server: &ConfiguredEndpoint,
              authority_side: AuthoritySide,
              connection: ConnectionHandle,
              client_host: HostState,
              server_host: HostState,
          ) -> (LiveSide, LiveSide) {
              let resources = resources();
              let server_address = server.endpoint().local_addr().unwrap();

              let client_profile = profile(
                  resources,
                  if authority_side == AuthoritySide::Client {
                      SemanticRole::Authority
                  } else {
                      SemanticRole::NonAuthority
                  },
              );
              let server_profile = profile(
                  resources,
                  if authority_side == AuthoritySide::Server {
                      SemanticRole::Authority
                  } else {
                      SemanticRole::NonAuthority
                  },
              );

              let (client_ready, server_ready) = join2(
                  connect_profile_ready(client, server_address, "localhost", client_profile),
                  accept_profile_ready(server, server_profile),
              )
              .await;
              let client_ready = client_ready.unwrap();
              let server_ready = server_ready
                  .unwrap()
                  .expect("server endpoint remained open");

              let contract = contract();
              let client_authority =
                  (authority_side == AuthoritySide::Client).then(|| contract.clone());
              let server_authority =
                  (authority_side == AuthoritySide::Server).then(|| contract.clone());

              let HostState {
                  negotiation: client_negotiation,
                  delivery: client_delivery,
              } = client_host;
              let HostState {
                  negotiation: server_negotiation,
                  delivery: server_delivery,
              } = server_host;

              let (client_established, server_established) = join2(
                  negotiate_side(client_ready, connection, client_negotiation, client_authority),
                  negotiate_side(server_ready, connection, server_negotiation, server_authority),
              )
              .await;

              let (client_negotiated, client_manager) = client_established;
              let (server_negotiated, server_manager) = server_established;
              let client_side = activate(
                  client_negotiated,
                  client_manager,
                  client_delivery,
                  connection,
              );
              let server_side = activate(
                  server_negotiated,
                  server_manager,
                  server_delivery,
                  connection,
              );

              (client_side, server_side)
          }
          '''
          text = text[:setup_start] + replacement_setup + text[setup_end:]

          wait_anchor = '\nasync fn wait_for_connection_terminal_error('
          wait_at = text.index(wait_anchor)
          replacement_scenario = '''
          async fn run_replacement_scenario() {
              let (client, server) = configured_endpoints();
              let (mut first_client, mut first_server) = establish_connection_on_endpoints(
                  &client,
                  &server,
                  AuthoritySide::Client,
                  FIRST_CONNECTION,
                  new_host(),
                  new_host(),
              )
              .await;

              let first_reliable = establish_flow(
                  &mut first_client,
                  &mut first_server,
                  DeliveryMode::ReliableOrdered,
                  21,
                  121,
              )
              .await;
              let first_sequenced = establish_flow(
                  &mut first_server,
                  &mut first_client,
                  DeliveryMode::UnreliableSequenced,
                  22,
                  122,
              )
              .await;

              assert_eq!(first_reliable.flow_id.side(), WireSide::Client);
              assert_eq!(first_reliable.flow_id.sequence(), 0);
              assert_eq!(first_sequenced.flow_id.side(), WireSide::Server);
              assert_eq!(first_sequenced.flow_id.sequence(), 0);
              for key in [
                  first_reliable.outbound,
                  first_reliable.inbound,
                  first_sequenced.outbound,
                  first_sequenced.inbound,
              ] {
                  assert_eq!(key.connection(), FIRST_CONNECTION);
              }

              send_unreliable_and_expect(
                  &mut first_server,
                  &mut first_client,
                  first_sequenced,
                  b"first-connection-sequenced".to_vec(),
              )
              .await;

              let first_reliable_flow_id = first_reliable.flow_id;
              let first_sequenced_flow_id = first_sequenced.flow_id;
              let client_host = teardown_live_side(first_client, 2);
              let server_host = teardown_live_side(first_server, 2);

              let (mut replacement_client, mut replacement_server) =
                  establish_connection_on_endpoints(
                      &client,
                      &server,
                      AuthoritySide::Client,
                      REPLACEMENT_CONNECTION,
                      client_host,
                      server_host,
                  )
                  .await;

              assert_eq!(replacement_client.host.delivery.active_flows(), 0);
              assert_eq!(replacement_server.host.delivery.active_flows(), 0);

              let replacement_reliable = establish_flow(
                  &mut replacement_client,
                  &mut replacement_server,
                  DeliveryMode::ReliableOrdered,
                  21,
                  121,
              )
              .await;
              let replacement_sequenced = establish_flow(
                  &mut replacement_server,
                  &mut replacement_client,
                  DeliveryMode::UnreliableSequenced,
                  22,
                  122,
              )
              .await;

              assert_eq!(replacement_reliable.flow_id, first_reliable_flow_id);
              assert_eq!(replacement_sequenced.flow_id, first_sequenced_flow_id);
              assert_eq!(replacement_reliable.flow_id.sequence(), 0);
              assert_eq!(replacement_sequenced.flow_id.sequence(), 0);
              for key in [
                  replacement_reliable.outbound,
                  replacement_reliable.inbound,
                  replacement_sequenced.outbound,
                  replacement_sequenced.inbound,
              ] {
                  assert_eq!(key.connection(), REPLACEMENT_CONNECTION);
                  assert_ne!(key.connection(), FIRST_CONNECTION);
              }

              send_reliable_and_expect(
                  &mut replacement_client,
                  &mut replacement_server,
                  replacement_reliable,
                  b"replacement-reliable".to_vec(),
              )
              .await;
              send_unreliable_and_expect(
                  &mut replacement_server,
                  &mut replacement_client,
                  replacement_sequenced,
                  b"replacement-sequenced".to_vec(),
              )
              .await;

              let _client_host = teardown_live_side(replacement_client, 2);
              let _server_host = teardown_live_side(replacement_server, 2);

              client
                  .endpoint()
                  .close(VarInt::from_u32(0), b"replacement-state test complete");
              server
                  .endpoint()
                  .close(VarInt::from_u32(0), b"replacement-state test complete");
              join2(client.endpoint().wait_idle(), server.endpoint().wait_idle()).await;
          }

          fn teardown_live_side(mut side: LiveSide, expected_flows: usize) -> HostState {
              let connection = side.connection;
              let teardown = side.driver.teardown(
                  &mut side.host.negotiation,
                  &mut side.host.delivery,
              );
              assert_eq!(teardown.connection, connection);
              assert!(teardown.negotiation_cleanup_error.is_none());
              assert_eq!(teardown.flow_terminations.len(), expected_flows);
              assert!(teardown.flow_terminations.iter().all(|termination| {
                  termination.reason == FlowTerminationReason::ConnectionEnded
              }));
              assert_eq!(side.host.delivery.active_flows(), 0);
              side.host
          }
          '''
          text = text[:wait_at] + '\n' + replacement_scenario + text[wait_at:]

          negotiation_start = text.index('async fn negotiate_side(')
          negotiation_end = text.index('\nasync fn complete_negotiation_send(', negotiation_start)
          negotiation_block = text[negotiation_start:negotiation_end]
          negotiation_block = negotiation_block.replace(
              '    admitted: AdmittedProfileReadyConnection,\n    mut manager: NegotiationManager,',
              '    admitted: AdmittedProfileReadyConnection,\n    connection: ConnectionHandle,\n    mut manager: NegotiationManager,',
              1,
          )
          negotiation_block = negotiation_block.replace(
              'begin_negotiation(admitted, FIRST_CONNECTION, &mut manager, offer())',
              'begin_negotiation(admitted, connection, &mut manager, offer())',
              1,
          )
          text = text[:negotiation_start] + negotiation_block + text[negotiation_end:]

          activate_start = text.index('fn activate(')
          activate_end = text.index('\nasync fn establish_flow(', activate_start)
          activate_replacement = '''fn activate(
              established: EstablishedNegotiatedConnection,
              negotiation: NegotiationManager,
              delivery: DeliveryEndpoint,
              connection: ConnectionHandle,
          ) -> LiveSide {
              let driver = established
                  .into_flow_control()
                  .unwrap()
                  .into_reliable_io(nz(4 * 1024), nz(128 * 1024))
                  .into_established_io()
                  .into_connection_driver();
              LiveSide {
                  connection,
                  driver,
                  host: HostState {
                      negotiation,
                      delivery,
                  },
              }
          }
          '''
          text = text[:activate_start] + activate_replacement + text[activate_end:]

          flow_start = text.index('async fn establish_flow(')
          flow_body = text.index(') -> LiveFlow {', flow_start) + len(') -> LiveFlow {')
          outbound_start = text.index('\n    let outbound = DeliveryFlowKey::new(', flow_body)
          sender_start = text.index('\n    sender', outbound_start)
          flow_prefix = '''
              let connection = sender.connection;
              assert_eq!(receiver.connection, connection);
              let outbound = DeliveryFlowKey::new(
                  connection,
                  FlowDirection::Outbound,
                  DeliveryFlowHandle::new(outbound_handle),
              );
              let inbound = DeliveryFlowKey::new(
                  connection,
                  FlowDirection::Inbound,
                  DeliveryFlowHandle::new(inbound_handle),
              );'''
          text = text[:outbound_start] + flow_prefix + text[sender_start:]

          path.write_text(text)
          PY
          cargo +stable fmt --all
      - name: Commit test-only evidence
        run: |
          if git diff --quiet -- crates/runen-net-quic/src/conformance_tests.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/runen-net-quic/src/conformance_tests.rs
          git commit -m "RN5E5A5O: add fresh replacement-state evidence"
          git push origin HEAD:rn5e5a5o-fresh-replacement-state
