name: A5T Test Patch

on:
  push:
    branches:
      - rn5e5a5t-malformed-control
    paths:
      - .github/workflows/a5t-test-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: rn5e5a5t-malformed-control
      - name: Add malformed control conformance evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          control = Path('crates/runen-net-quic/src/control.rs')
          text = control.read_text()
          anchor = "    pub(super) async fn send_frame(\n"
          if anchor not in text:
              raise SystemExit('ControlSender send_frame anchor not found')
          hook = "    #[cfg(test)]\n    pub(super) async fn send_raw_bytes_for_test(\n        &mut self,\n        bytes: &[u8],\n    ) -> Result<(), ControlFrameError> {\n        self.send.write_all(bytes).await?;\n        Ok(())\n    }\n\n"
          text = text.replace(anchor, hook + anchor, 1)
          control.write_text(text)

          test = Path('crates/runen-net-quic/src/conformance_tests.rs')
          text = test.read_text()
          text = text.replace(
              "use quinn::{\n    VarInt,\n",
              "use quinn::{\n    ConnectionError, VarInt,\n",
              1,
          )
          old_control = "    control::{LocalControlLimits, ProfileBootstrapError, SemanticRole, ValidatedControlProfile},\n"
          new_control = "    control::{\n        ControlFrameError, LocalControlLimits, ProfileBootstrapError, SemanticRole,\n        ValidatedControlProfile, bootstrap_server_control, confirm_profile_transport,\n    },\n"
          if old_control not in text:
              raise SystemExit('control import anchor not found')
          text = text.replace(old_control, new_control, 1)
          old_lifecycle = "        AdmittedProfileReadyConnection, EstablishedNegotiatedConnection, NegotiationSendCompletion,\n        NegotiationTransition, PendingNegotiationSend, ProfileConnectionError,\n        accept_profile_ready, begin_negotiation, connect_profile_ready,\n"
          new_lifecycle = "        AdmittedProfileReadyConnection, EstablishedNegotiatedConnection, NegotiationLifecycleError,\n        NegotiationReceiveError, NegotiationSendCompletion, NegotiationTransition,\n        PendingNegotiationSend, ProfileConnectionError, accept_profile_ready, begin_negotiation,\n        connect_profile_ready,\n"
          if old_lifecycle not in text:
              raise SystemExit('lifecycle import anchor not found')
          text = text.replace(old_lifecycle, new_lifecycle, 1)
          old_wire = "    wire::{FlowId, WireSide},\n"
          new_wire = "    wire::{ApplicationErrorCode, FlowId, WireSide},\n"
          if old_wire not in text:
              raise SystemExit('wire import anchor not found')
          text = text.replace(old_wire, new_wire, 1)

          marker = "#[test]\nfn live_overlapping_connection_is_refused_at_server_capacity_and_slot_reopens() {\n"
          if marker not in text:
              raise SystemExit('A5S test anchor not found')
          addition = """#[test]
          fn live_unknown_post_profile_control_frame_closes_with_control_frame_error() {
              let runtime = Builder::new_current_thread().enable_all().build().unwrap();
              runtime.block_on(async {
                  tokio::time::timeout(SCENARIO_TIMEOUT, run_unknown_control_frame_scenario())
                      .await
                      .expect(\"live malformed-control conformance scenario timed out\");
              });
          }

          async fn run_unknown_control_frame_scenario() {
              let resources = resources_with_max_connections(1);
              let (certificate, private_key, roots) = ephemeral_identity();
              let client = bind_client_endpoint(loopback_ephemeral(), resources, roots).unwrap();
              let server = bind_server_endpoint(
                  loopback_ephemeral(),
                  resources,
                  vec![certificate],
                  private_key,
              )
              .unwrap();
              let server_address = server.endpoint().local_addr().unwrap();

              let adversarial_server = async {
                  let incoming = server
                      .endpoint()
                      .accept()
                      .await
                      .expect(\"adversarial server endpoint closed before connection\");
                  let connecting = incoming
                      .accept()
                      .expect(\"adversarial server rejected valid QUIC admission\");
                  let connection = connecting
                      .await
                      .expect(\"adversarial server failed valid runennet/1 handshake\");
                  let transport = confirm_profile_transport(connection)
                      .expect(\"adversarial server failed production transport confirmation\");
                  bootstrap_server_control(
                      transport,
                      profile(resources, SemanticRole::NonAuthority),
                  )
                  .await
                  .expect(\"adversarial server failed production ProfileReady bootstrap\")
              };

              let (client_ready, server_ready) = join2(
                  connect_profile_ready(
                      &client,
                      server_address,
                      \"localhost\",
                      profile(resources, SemanticRole::Authority),
                  ),
                  adversarial_server,
              )
              .await;
              let client_ready = client_ready.expect(\"production client failed ProfileReady\");
              let mut server_parts = server_ready.into_parts();

              let mut manager = new_manager();
              let pending = begin_negotiation(client_ready, FIRST_CONNECTION, &mut manager, offer())
                  .expect(\"valid client offer failed before send\");
              let transition = complete_negotiation_send(pending).await;
              let mut negotiating = match transition {
                  NegotiationTransition::Negotiating(negotiating) => negotiating,
                  other => panic!(\"valid client offer did not enter receive phase: {other:?}\"),
              };

              server_parts
                  .sender
                  .send_raw_bytes_for_test(&[10])
                  .await
                  .expect(\"adversarial raw control byte was not written\");

              let receive_error = negotiating
                  .receive()
                  .await
                  .expect_err(\"unknown control frame unexpectedly reached negotiation semantics\");
              assert!(matches!(
                  &receive_error,
                  NegotiationReceiveError::Control(ProfileBootstrapError::Frame(
                      ControlFrameError::UnknownFrameType(10)
                  ))
              ));
              let NegotiationReceiveError::Control(control_error) = receive_error else {
                  unreachable!(\"exact control error was asserted above\");
              };
              let lifecycle_error =
                  negotiating.abort_after_control_error(&mut manager, control_error);
              assert!(matches!(
                  lifecycle_error,
                  NegotiationLifecycleError::IoAbort {
                      error: Some(ProfileBootstrapError::Frame(
                          ControlFrameError::UnknownFrameType(10)
                      )),
                      cleanup_error: None,
                  }
              ));

              match server_parts.connection.closed().await {
                  ConnectionError::ApplicationClosed(close) => assert_eq!(
                      close.error_code,
                      ApplicationErrorCode::ControlFrameError.quinn()
                  ),
                  other => panic!(\"malformed control produced wrong peer close: {other:?}\"),
              }

              client
                  .endpoint()
                  .close(VarInt::from_u32(0), b\"malformed-control test complete\");
              server
                  .endpoint()
                  .close(VarInt::from_u32(0), b\"malformed-control test complete\");
              join2(client.endpoint().wait_idle(), server.endpoint().wait_idle()).await;
          }

          """
          test.write_text(text.replace(marker, addition + marker, 1))
          PY
          cargo +stable fmt --all
      - name: Commit test-only evidence
        run: |
          if git diff --quiet -- crates/runen-net-quic/src/control.rs crates/runen-net-quic/src/conformance_tests.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/runen-net-quic/src/control.rs crates/runen-net-quic/src/conformance_tests.rs
          git commit -m "RN5E5A5T: prove malformed control is connection-terminal"
          git push origin HEAD:rn5e5a5t-malformed-control
